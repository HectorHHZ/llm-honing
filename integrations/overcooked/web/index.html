<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overcooked · Honing</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#20352d;background:#f3f2ec}*{box-sizing:border-box}body{margin:0}header{padding:24px 32px;background:#163e30;color:#fff;display:flex;align-items:center;justify-content:space-between}h1{font-size:26px;margin:0}header p{margin:7px 0 0;color:#c9ded2}main{max-width:1500px;padding:24px;margin:auto;display:grid;grid-template-columns:minmax(480px,1.15fr) minmax(350px,1fr);gap:22px}.card{background:white;border:1px solid #dde3da;border-radius:14px;padding:20px;box-shadow:0 4px 20px #183e3008}h2{font-size:17px;margin:0 0 15px}.screen{min-height:390px;display:flex;align-items:center;justify-content:center;background:#e8e7dd;border-radius:10px;padding:16px}.screen img{max-width:100%;max-height:560px;image-rendering:pixelated}.toolbar,.settings{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button,select,input{font:inherit;border:1px solid #c5d1c8;border-radius:7px;padding:9px;background:#fff;color:inherit}button{cursor:pointer}button.primary{background:#225c42;color:white;border-color:#225c42}button:hover{filter:brightness(.95)}button:disabled{opacity:.45;cursor:default}label{font-size:13px;display:flex;align-items:center;gap:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.stat{padding:12px;background:#f0f5ef;border-radius:8px;font-size:12px}.stat strong{display:block;font-size:23px;margin-top:4px}.keys{display:flex;gap:6px;flex-wrap:wrap}.hint{font-size:13px;color:#5c6e61;line-height:1.7}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button.active{background:#e2ede3}pre{background:#102b23;color:#d5eddb;border-radius:8px;padding:16px;overflow:auto;max-height:430px;font:12px/1.65 Consolas,monospace;white-space:pre-wrap;word-break:break-word}#message{white-space:pre-wrap;word-break:break-all;min-height:25px;font-size:13px;padding-top:10px}#message.error{color:#ad3330}.rules{font-size:14px;line-height:1.8;padding-left:20px}.badge{font-size:12px;color:#cbe4d6}input[type=range]{width:100%}@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}header{padding:20px}.screen{min-height:240px}}
</style>
<header><div><h1>一起开厨房 / Overcooked</h1><p>Honing · 合作决策环境</p></div><span class="badge" id="status">连接中</span></header>
<main><section class="card"><h2>厨房观察</h2><div class="stats"><div class="stat">当前步<strong id="step">—</strong></div><div class="stat">交付汤品<strong id="soups">—</strong></div><div class="stat">团队得分<strong id="score">—</strong></div><div class="stat">剩余步数<strong id="left">—</strong></div></div>
<div class="screen"><img id="game" alt="原生 Overcooked-AI 厨房画面"></div>
<div class="toolbar"><select id="policy"><option value="human">人工单步</option><option value="baseline" selected>观看规则基线</option><option value="model">观看模型</option></select><button class="primary" id="play">开始</button><button id="once">前进一步</button><button id="export">保存当前轨迹</button><label>间隔 <select id="speed"><option value="70">快</option><option value="200" selected>正常</option><option value="600">慢</option></select></label></div>
<div class="keys" id="keys"><button data-action="NORTH">W ↑</button><button data-action="WEST">A ←</button><button data-action="SOUTH">S ↓</button><button data-action="EAST">D →</button><button data-action="INTERACT">空格 · 交互</button><button data-action="STAY">等待</button></div>
<p class="hint" id="controlHint">控制厨师 0；队友由独立规则策略控制。面向设施后再交互。显示的画面与右侧状态属于同一游戏步。</p><div id="replayControls" hidden><label>回放位置</label><input id="seek" type="range" min="0" max="0" value="0"></div><div id="message" role="status" aria-live="polite"></div>
</section><section class="card"><h2>场景与观察接口</h2><div class="settings"><label>厨房 <select id="layout"></select></label><label>烹饪 <select id="dynamics"><option value="false">手动开火</option><option value="true">三材料自动开火</option></select></label><label>操控 <select id="player"><option value="0">厨师 0</option><option value="1">厨师 1</option></select></label><label>队友 <select id="partner"><option value="role">角色分工</option><option value="solo">自主贪心</option><option value="stay">等待</option></select></label><button id="reset">新开一局</button></div>
<p class="hint">每局固定 400 步。全厨房公开观察；双方先根据当前局面选动作，再共同推进。模型思考期间游戏暂停。</p>
<div class="tabs"><button class="active" data-tab="rules">游戏规则</button><button data-tab="state">动态状态</button><button data-tab="map">地图</button><button data-tab="frame">完整观察</button></div><div id="ruleText"></div><pre id="json" hidden></pre><p class="hint">可读取 <a href="/api/state" target="_blank">/api/state</a>、<a href="/api/map" target="_blank">/api/map</a>、<a href="/api/rules" target="_blank">/api/rules</a>。基线表现仅用于检查游戏运行。</p>
</section></main>
<script>
let snapshot, running=false, pending=false, timer, tab='rules';
const $=id=>document.getElementById(id);
const message=(text,error=false)=>{$('message').textContent=text;$('message').className=error?'error':''};
async function api(path,body){const response=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const value=await response.json();if(!response.ok)throw Error(value.error||response.statusText);return value}
function render(value){snapshot=value;const f=value.frame;$('step').textContent=f.step;$('soups').textContent=f.deliveries;$('score').textContent=f.score;$('left').textContent=f.max_steps-f.step;$('status').textContent=value.replay?'已验证原生回放':f.status==='running'?'厨房进行中':'本局结束';$('game').src='/frame.png?step='+f.step+'&hash='+f.frame_hash;$('policy').querySelector('[value=model]').disabled=!value.model_available;$('replayControls').hidden=!value.replay;$('seek').max=Math.max(0,value.replay_length-1);$('seek').value=value.replay_index;$('export').disabled=value.replay;$('controlHint').textContent=`控制厨师 ${value.scenario.controlled_player}；队友策略 ${value.scenario.partner}。WASD / 方向键移动，空格交互。`;showTab();if((!value.replay&&f.status!=='running')||(value.replay&&value.replay_index===value.replay_length-1))stop();}
function showTab(){if(!snapshot)return;const f=snapshot.frame;$('json').hidden=tab==='rules';$('ruleText').hidden=tab!=='rules';if(tab==='rules'){const list=document.createElement('ul');list.className='rules';const rules=[`坐标 [x,y]，右/下为正。厨师朝向决定交互目标。`,`当前为${f.rules.old_dynamics?'自动':'手动'}开火；默认三洋葱汤烹饪 20 个游戏步，交付得 20 分。`,...f.rules.instructions];for(const text of rules){const li=document.createElement('li');li.textContent=text;list.appendChild(li)}$('ruleText').replaceChildren(list)}else $('json').textContent=JSON.stringify(tab==='frame'?f:f[tab],null,2)}
function stop(){running=false;clearTimeout(timer);$('play').textContent='开始'}
async function step(action){if(pending||!snapshot)return;pending=true;$('once').disabled=true;try{const body=snapshot.replay?{}:{policy:action?'human':$('policy').value,action:action||'STAY',frame_hash:snapshot.frame.frame_hash};render(await api('/api/step',body));message('')}catch(error){stop();message(error.message,true)}finally{pending=false;$('once').disabled=false}if(running)timer=setTimeout(()=>step(),Number($('speed').value))}
$('play').onclick=()=>{if(running)stop();else{running=true;$('play').textContent='暂停';step()}};$('once').onclick=()=>{stop();step()};$('policy').onchange=stop;
$('reset').onclick=async()=>{stop();try{render(await api('/api/reset',{layout:$('layout').value,old_dynamics:$('dynamics').value==='true',controlled_player:Number($('player').value),partner:$('partner').value}));message('已开始新的一局；上一局轨迹已保留')}catch(error){message(error.message,true)}};
$('export').onclick=async()=>{stop();try{const data=await api('/api/export',{});message('轨迹已保存：'+data.out)}catch(error){message(error.message,true)}};
$('seek').onchange=async()=>{stop();try{render(await api('/api/step',{index:Number($('seek').value)}))}catch(error){message(error.message,true)}};
for(const button of document.querySelectorAll('[data-action]'))button.onclick=()=>{stop();step(button.dataset.action)};
for(const button of document.querySelectorAll('[data-tab]'))button.onclick=()=>{tab=button.dataset.tab;for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b===button);showTab()};
document.addEventListener('keydown',event=>{if(['SELECT','INPUT','TEXTAREA'].includes(event.target.tagName)||event.repeat||snapshot?.replay)return;const action={w:'NORTH',a:'WEST',s:'SOUTH',d:'EAST',ArrowUp:'NORTH',ArrowDown:'SOUTH',ArrowLeft:'WEST',ArrowRight:'EAST',' ':'INTERACT'}[event.key];if(action){event.preventDefault();stop();step(action)}});
api('/api/state').then(value=>{for(const layout of value.layouts){const option=document.createElement('option');option.value=layout;option.textContent=layout;$('layout').appendChild(option)}$('layout').value=value.scenario.layout;$('dynamics').value=String(value.scenario.old_dynamics);$('player').value=value.scenario.controlled_player;$('partner').value=value.scenario.partner;render(value);if(value.replay){$('keys').hidden=true;$('policy').disabled=true;for(const control of document.querySelectorAll('.settings select'))control.disabled=true}}).catch(error=>message(error.message,true));
</script>
</html>
