default_language_version:
  python: python3

# The pinned Hollow Knight harness snapshot keeps the exact bytes that the
# harness fingerprint of every Exp 0 v0 manifest was computed over.
exclude: ^integrations/hollow-knight-forestdango/exp0/v0/harness/

ci:
  autofix_prs: true
  autoupdate_schedule: quarterly

repos:
  - repo: local
    hooks:
      - id: commit-message
        name: Check Conventional Commits subject
        entry: python .github/scripts/check_commit_message.py
        language: system
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        # Recorded tank rounds and historical HTTP samples keep their exact bytes.
        exclude: ^(tests/fixtures/decision_traces/|integrations/[^/]+/validation/review-sample/response\.raw$)
      - id: trailing-whitespace
        # Recorded tank rounds: their manifests hash the files byte for byte.
        exclude: ^tests/fixtures/decision_traces/
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: ["--profile=black", "--filter-files"]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
