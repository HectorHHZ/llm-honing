[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-honing"
description = "Continual specialization infra: a large model that sheds its own dead weight while it learns"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "Haoze He" }]
keywords = ["llm", "pruning", "post-training", "moe", "continual-learning", "distillation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # No license classifier: PEP 639 superseded it, and setuptools rejects a
    # classifier alongside the `license` expression above.
    # sync with requires-python and the CI matrix in .github/workflows/ci.yml
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "isort==9.0.1",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov",
    "ruff==0.16.6",
]
# Diagram sources under system-design/ render with matplotlib alone.
docs = ["matplotlib>=3.8"]
# GEPA parent sampling calls upstream's pure functions; the engine loop is not used.
# Pinned exactly: Honing's parity tests assert upstream's draws.
gepa = ["gepa==0.1.4"]

[project.urls]
Homepage = "https://github.com/HectorHHZ/llm-honing"
Issues = "https://github.com/HectorHHZ/llm-honing/issues"

# Slime is the one training-framework dependency, pinned by commit. It is installed
# only inside the supported GPU image, with `uv pip install --no-deps --group runtime`,
# so it does not replace that image's CUDA-specific torch, SGLang, and Megatron.
# Only modules under honing/backends/ may import it (tests/contracts/test_boundaries.py).
[dependency-groups]
runtime = ["slime @ git+https://github.com/THUDM/slime.git@41014d1f29e201137fdffce737bb8bac65bc5219"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
include = ["honing", "honing.*"]

[tool.isort]
profile = "black"          # black-compatible
line_length = 119          # keep in sync with [tool.black] and [tool.ruff]
py_version = 310
known_first_party = ["honing"]
src_paths = ["honing", "tests"]

[tool.black]
line_length = 119
# Without this, black infers a target from the running interpreter and formats
# for a Python newer than the project supports; 26.5.1 warns that its own AST
# safety check cannot then verify the result. Sync with requires-python.
target-version = ["py310"]

[tool.ruff]
target-version = "py310"   # sync with requires-python
line-length = 119          # sync with [tool.black] and [tool.isort]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "RET",     # flake8-return
    "PERF",    # perflint
    "LOG",     # flake8-logging
    "N",       # pep8-naming
    "RUF",     # ruff
]

[tool.ruff.lint.per-file-ignores]
# Diagram sources set the matplotlib backend before importing pyplot, which
# necessarily puts an import after a statement.
"system-design/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["honing"]
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

# Model libraries exist only in the GPU environment, and backends import them lazily.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "laya", "laya.*", "transformers", "transformers.*", "safetensors", "safetensors.*"]
ignore_missing_imports = true

# gepa is an optional extra; the documented ".[dev]" setup must type-check without it.
[[tool.mypy.overrides]]
module = ["gepa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "unit: no I/O beyond a temporary directory; runs everywhere",
    "integration: several components together; may start subprocesses",
    "gpu: requires an accelerator; skipped in CI",
    "slow: takes more than roughly ten seconds",
]

[tool.coverage.run]
source = ["honing"]
branch = true

[tool.coverage.report]
show_missing = true
