name: mutation

# Mutation testing with mutmut: every mutant of the modules in [tool.mutmut] that a test covers must be killed,
# or listed in tests/mutation_equivalent.txt as equivalent to the original. Weekly, and on demand, since a run
# takes minutes per module.
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "mutmut==3.8.1"
      - name: Mutate
        run: mutmut run --max-children 4
      - name: Check the survivors
        run: python scripts/checks/mutation_survivors.py
