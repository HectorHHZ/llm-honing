name: review

# Sets every open pull request's commit status `review` (.github/scripts/review_gate.py): success for a lead
# reviewer's own pull request, or with a lead reviewer's approval. The ruleset in .github/rulesets/main.json requires it.
#
# Only triggers that run main's copy of this workflow and the script, so a pull request cannot change its own
# gate: pushes (pull_request_target), comments, and a run every 15 minutes, which also picks up new reviews.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  issue_comment:
    types: [created]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: review

jobs:
  review:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set the review status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/review_gate.py
