name: labeler

# Puts the area labels of .github/labeler.yml on every pull request from the paths it changes, and the type label
# its title names (.github/scripts/type_label.py). Runs main's copy (pull_request_target) and never checks out the
# pull request's code, so a fork's pull request can be labelled without its code running with a write token.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
      # The base branch's code, not the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Label the type the title names
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: python .github/scripts/type_label.py
