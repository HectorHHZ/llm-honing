name: labeler

# Puts the area labels of .github/labeler.yml on every pull request from the paths it changes. Runs
# main's copy (pull_request_target) and never checks out the pull request's code, so a fork's pull
# request can be labelled without its code running with a write token.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: false
