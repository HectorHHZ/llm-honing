name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx run pre-commit run --all-files --show-diff-on-failure
      - name: Type check
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gepa]"
          python -m mypy

  commit-subject:
    # A squash merge derives the commit subject from the pull request title, so
    # the title is what has to satisfy the commit rules.
    #
    # A bot's title is written by the tool, not by a contributor, and its wording
    # is not configurable: Dependabot always capitalizes "Bump ...". That is the
    # same reason check_commit_message.py exempts the subjects git generates, so
    # bot-authored pull requests are exempt here rather than permanently red.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python .github/scripts/check_commit_message.py --subject "$PR_TITLE"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # sync with requires-python and the classifiers in pyproject.toml
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,gepa]"
      - name: Test
        run: python -m pytest -m "not gpu" --cov --cov-report=term-missing

  game-install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and install games outside the source checkout
        run: |
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/game-wheel"
          "$RUNNER_TEMP/game-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/game-wheel/bin/python" -I scripts/checks/game_install.py

  weight-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU checkpoint-edit dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy safetensors pytest
      - name: Check generic editing, NanoJev compatibility, and the shared decision-training loops
        run: python -m pytest tests/test_weight_edit.py tests/test_direction_edit.py tests/test_decision_training.py

  griddly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the native loader and isolated Griddly runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1
          python -m venv integrations/griddly/.venv
          integrations/griddly/.venv/bin/python -m pip install -r integrations/griddly/requirements-render.txt pytest
      - name: Check native rules, HTTP decisions, replay and typed training data
        run: integrations/griddly/.venv/bin/python -m pytest tests/test_griddly.py
      - name: Check the native runner against Honing contracts
        run: |
          integrations/griddly/.venv/bin/python scripts/e2e/check_runner.py \
            --config configs/e2e/griddly_runner_check.json --work-dir "$RUNNER_TEMP/griddly-check"

  craftax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the isolated Craftax runtime
        run: python -m pip install -r integrations/craftax/requirements.txt pytest
      - name: Check Craftax contracts, the real engine, HTTP decisions and native video
        run: python -m pytest tests/test_craftax.py

  rea-issac:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Check the real simulation, UI, model bridge and replay
        run: python -m pytest tests/test_rea_issac*.py

  test-litellm:
    # The test job above installs no litellm, which is what shows honing works without the extra.
    # This job installs it and runs the client, and the live GEPA run, against local stub servers;
    # no request leaves the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gepa,litellm]"
      - name: Test
        run: python -m pytest -m "not gpu" tests/test_chat_client.py tests/test_gepa_live_offline.py tests/contracts

  test-sandbox:
    # The test job above runs the sandbox's Docker tests (the runners have Docker) but has no slime, so the tests of
    # slime's own helpers skip there. This job puts slime's agent package (pure Python at the pin) on PYTHONPATH, and
    # HONING_REQUIRE_* turns any skip into a failure.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fetch slime's agent package at the pinned commit
        run: scripts/fetch-slime-agent.sh "$RUNNER_TEMP/slime"
      - name: Test
        env:
          HONING_REQUIRE_DOCKER: "1"
          HONING_REQUIRE_SLIME: "1"
        run: |
          docker version
          PYTHONPATH="$RUNNER_TEMP/slime" python -m pytest -m "not gpu" -rs tests/test_slime_sandbox.py tests/contracts
          test -z "$(docker ps --all --quiet --filter label=honing.sandbox=1)"

  ra2-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/ra2/package-lock.json
      - name: Check the RA2 integration without the engine, game files, or models
        working-directory: integrations/ra2
        run: |
          npm ci
          npm test
          npm run format:check

  tank-war:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/tank-war/package-lock.json
      - name: Check Tank War and the model bridge
        working-directory: integrations/tank-war
        run: |
          npm ci
          npm test
          npm run format:check

  e2e:
    # End to end on every pull request: the processes a run starts, talking as they do in a run, with no GPU, game
    # files, or model weights. GPU and in-game checks of a model or engine change are run by hand and reported in the
    # pull request's End-to-end section.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        # The gepa extra is for the tank campaign, whose harness moves run GEPA.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gepa]"
      - name: All planes end to end (every plane in one campaign, a reference harness runner and agent process)
        run: python scripts/e2e/honing_pipeline.py --config configs/e2e/all_planes.json --work-dir "$RUNNER_TEMP/all-planes"
      - name: Meta-Harness end to end (a scripted proposer, search tasks held out from the gate, a weights change)
        run: python scripts/e2e/honing_pipeline.py --config configs/e2e/meta_harness_dry_run.json --work-dir "$RUNNER_TEMP/meta-harness"
      - name: Harness runner contract (the checks an OpenHands or Reef runner must pass)
        run: python scripts/e2e/check_runner.py --config configs/e2e/all_planes.json --work-dir "$RUNNER_TEMP/runner-check"
      - name: Trainer contract (the checks a Slime trainer must pass)
        run: python scripts/e2e/check_trainer.py --config configs/e2e/all_planes.json --work-dir "$RUNNER_TEMP/trainer-check"
      - name: Slime's declared support (trainer contract, then SFT, self-distillation, GRPO and harness moves in one campaign)
        run: |
          python scripts/e2e/check_trainer.py --config configs/e2e/slime.json --work-dir "$RUNNER_TEMP/slime-check"
          python scripts/e2e/honing_pipeline.py --config configs/e2e/slime.json --work-dir "$RUNNER_TEMP/slime"
      - name: Campaign end to end (runner, grader, gate, trainer, release chain)
        run: |
          python scripts/e2e/ra2_campaign.py --config configs/e2e/ra2_dry_run.json --work-dir "$RUNNER_TEMP/campaign"
          python scripts/e2e/check_campaign.py "$RUNNER_TEMP/campaign" --expect harness="rolled back" --expect train=published
      - name: Tank campaign end to end (real rounds against the planner, GEPA, teacher sft, grpo rollouts)
        run: |
          python scripts/e2e/tank_campaign.py --config configs/e2e/tank_dry_run.json --work-dir "$RUNNER_TEMP/tank-campaign"
          python scripts/e2e/check_campaign.py "$RUNNER_TEMP/tank-campaign" \
            --expect harness=published --expect train=published --expect train="rolled back"
      - name: Tank harness runner contract
        run: python scripts/e2e/check_runner.py --config configs/e2e/tank_runner_check.json --work-dir "$RUNNER_TEMP/tank-runner-check"
      - name: Serving end to end (decision server process, the match's Node client stack)
        run: scripts/e2e/serving.sh "$RUNNER_TEMP/serving"
      - name: Tank War end to end (decision server, HTTP bridge, both decision interfaces)
        run: node scripts/e2e/tank-war.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-output
          path: |
            ${{ runner.temp }}/all-planes/summary.json
            ${{ runner.temp }}/meta-harness/summary.json
            ${{ runner.temp }}/campaign/summary.json
            ${{ runner.temp }}/campaign/releases/commits.jsonl
            ${{ runner.temp }}/tank-campaign/summary.json
            ${{ runner.temp }}/tank-campaign/releases/commits.jsonl
            ${{ runner.temp }}/serving/server.err
          if-no-files-found: ignore

  openhands:
    # The OpenHands runner with the real worker, in OpenHands' own environment installed from its lock
    # (integrations/openhands/README.md). No model or key: every episode is a real OpenHands conversation with the
    # stand-in policy server, so this catches a lock that no longer installs or a worker that no longer runs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Honing and the OpenHands environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . uv
          uv venv --python 3.12 integrations/openhands/.venv
          uv pip install --python integrations/openhands/.venv/bin/python -r integrations/openhands/requirements.txt
      - name: Harness runner contract with OpenHands as the agent
        run: python scripts/e2e/check_runner.py --config configs/e2e/openhands.json --work-dir "$RUNNER_TEMP/openhands-check"
      - name: All planes with OpenHands as the agent
        run: python scripts/e2e/honing_pipeline.py --config configs/e2e/openhands.json --work-dir "$RUNNER_TEMP/openhands"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openhands-output
          path: |
            ${{ runner.temp }}/openhands-check/workspaces/*/agent.log
            ${{ runner.temp }}/openhands/summary.json
          if-no-files-found: ignore
