name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx run pre-commit run --all-files --show-diff-on-failure
      - name: Type check
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m mypy

  commit-subject:
    # A squash merge derives the commit subject from the pull request title, so
    # the title is what has to satisfy the commit rules.
    #
    # A bot's title is written by the tool, not by a contributor, and its wording
    # is not configurable: Dependabot always capitalizes "Bump ...". That is the
    # same reason check_commit_message.py exempts the subjects git generates, so
    # bot-authored pull requests are exempt here rather than permanently red.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python .github/scripts/check_commit_message.py --subject "$PR_TITLE"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # sync with requires-python and the classifiers in pyproject.toml
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"
      - name: Test
        run: python -m pytest -m "not gpu" --cov --cov-report=term-missing
