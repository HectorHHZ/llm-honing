name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx run pre-commit run --all-files --show-diff-on-failure
      - name: Type check
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gepa]"
          python -m mypy

  commit-subject:
    # A pull request lands on main with a merge commit, so its title (the merge
    # commit's description) and each of its commits have to satisfy the commit
    # rules, and the branch must hold no merge from main (it is rebased instead).
    #
    # A bot's title is written by the tool, not by a contributor, and its wording
    # is not configurable: Dependabot always capitalizes "Bump ...". That is the
    # same reason check_commit_message.py exempts the subjects git generates, so
    # bot-authored pull requests are exempt here rather than permanently red.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch and the pull request's commits, to check each of them.
          fetch-depth: 0
      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python .github/scripts/check_commit_message.py --subject "$PR_TITLE"
      - name: Check every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/check_commit_message.py --range "$BASE_SHA..$HEAD_SHA"

  test:
    runs-on: ubuntu-latest
    # Runner speed varies about 2x: one Python version's job has taken 5 to 15 minutes.
    # 3.11 also plays the tank dry run.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # sync with requires-python and the classifiers in pyproject.toml
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,gepa,reef]"
      - name: Test
        env:
          # The tank dry run takes minutes, and the e2e job plays its config on 3.12, so only 3.11 plays it here.
          HONING_SKIP_TANK_DRY_RUN: ${{ matrix.python-version != '3.11' && '1' || '' }}
        run: python -m pytest -m "not gpu" --cov --cov-report=term-missing

  game-install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and install games outside the source checkout
        run: |
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/game-wheel"
          "$RUNNER_TEMP/game-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/game-wheel/bin/python" -I scripts/checks/game_install.py

  weight-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install CPU checkpoint-edit dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy safetensors pytest
      - name: Check generic editing, NanoJev compatibility, and the shared decision-training loops
        run: python -m pytest tests/test_weight_edit.py tests/test_direction_edit.py tests/test_decision_training.py

  griddly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the native loader and isolated Griddly runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1
          python -m venv integrations/griddly/.venv
          integrations/griddly/.venv/bin/python -m pip install -r integrations/griddly/requirements-render.txt pytest
      - name: Check native rules, HTTP decisions, replay and typed training data
        run: integrations/griddly/.venv/bin/python -m pytest tests/test_griddly.py
      - name: Check the native runner against Honing contracts
        run: |
          integrations/griddly/.venv/bin/python scripts/e2e/check_runner.py \
            --config configs/e2e/griddly_runner_check.json --work-dir "$RUNNER_TEMP/griddly-check"

  craftax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the isolated Craftax runtime
        run: python -m pip install -r integrations/craftax/requirements.txt pytest
      - name: Check Craftax contracts, the real engine, HTTP decisions and native video
        run: python -m pytest tests/test_craftax.py

  rea-issac:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Check the real simulation, UI, model bridge and replay
        run: python -m pytest tests/test_rea_issac*.py

  test-litellm:
    # The test job above installs no litellm, which is what shows honing works without the extra.
    # This job installs it and runs the client, and the live GEPA run, against local stub servers;
    # no request leaves the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gepa,litellm]"
      - name: Test
        run: python -m pytest -m "not gpu" tests/test_chat_client.py tests/test_gepa_live_offline.py tests/contracts

  reef:
    # Honing's Reef recipe (#137) against a real Reef, which runs in its own environment as in production.
    # The recipe tests skip in the test job above, which installs no Reef.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,reef]"
          # Reef at the commit #137 pins, in a venv of its own.
          python -m venv "$RUNNER_TEMP/reef"
          "$RUNNER_TEMP/reef/bin/pip" install \
            "reef-infra @ git+https://github.com/Human-Agent-Society/reef@bc8c15081bfdbd2ea0a4ceacc045545f020da668"
      - name: Test
        env:
          HONING_REEF_BIN: ${{ runner.temp }}/reef/bin/reef
        run: python -m pytest tests/test_reef_records.py tests/test_reef_provider.py tests/test_reef_recipe.py

  test-sandbox:
    # The test job above runs the sandbox's Docker tests (the runners have Docker) but has no slime, so the tests of
    # slime's own helpers skip there. This job puts slime's agent package (pure Python at the pin) on PYTHONPATH, and
    # HONING_REQUIRE_* turns any skip into a failure.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fetch slime's agent package at the pinned commit
        run: scripts/fetch-slime-agent.sh "$RUNNER_TEMP/slime"
      - name: Test
        env:
          HONING_REQUIRE_DOCKER: "1"
          HONING_REQUIRE_SLIME: "1"
        run: |
          docker version
          PYTHONPATH="$RUNNER_TEMP/slime" python -m pytest -m "not gpu" -rs tests/test_slime_sandbox.py tests/contracts
          test -z "$(docker ps --all --quiet --filter label=honing.sandbox=1)"

  test-agent-worker:
    # The slime agent worker end to end: slime's real adapter and harness, in the environment
    # scripts/setup-slime-agent-env.sh builds (CPU torch and a full slime checkout at the pin), against a
    # fake model and a fake CLI in a real container. HONING_REQUIRE_* turns any skip into a failure.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" uv==0.11.24
      - name: Build the slime agent environment
        run: scripts/setup-slime-agent-env.sh "$RUNNER_TEMP/slime-agent"
      - name: Test
        env:
          HONING_REQUIRE_DOCKER: "1"
          HONING_REQUIRE_SLIME_AGENT: "1"
        run: |
          HONING_SLIME_AGENT_ENV="$RUNNER_TEMP/slime-agent" python -m pytest -m "not gpu" -rs tests/test_slime_agent_worker.py
          test -z "$(docker ps --all --quiet --filter label=honing.sandbox=1)"

  ra2-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/ra2/package-lock.json
      - name: Check the RA2 integration without the engine, game files, or models
        working-directory: integrations/ra2
        run: |
          npm ci
          npm test
          npm run format:check

  tank-war:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/tank-war/package-lock.json
      - name: Check Tank War and the model bridge
        working-directory: integrations/tank-war
        run: |
          npm ci
          npm test
          npm run format:check

  e2e:
    # End to end on every pull request: the processes a run starts, talking as they do in a run, with no GPU, game
    # files, or model weights. A model or engine change also needs the GPU check, which a reviewer's /gpu comment
    # runs (gpu.yml, scripts/gpu/README.md). In-game checks are run by hand and reported in the End-to-end section.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        # The gepa extra is for the tank campaign, whose harness moves run GEPA.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gepa]"
      - name: All planes end to end (every plane in one campaign, a reference harness runner and agent process)
        run: |
          python scripts/e2e/honing_pipeline.py --config configs/e2e/all_planes.json --work-dir "$RUNNER_TEMP/all-planes"
          python scripts/e2e/check_campaign.py "$RUNNER_TEMP/all-planes"
      - name: Meta-Harness end to end (a scripted proposer, search tasks held out from the gate, a weights change)
        run: python scripts/e2e/honing_pipeline.py --config configs/e2e/meta_harness_dry_run.json --work-dir "$RUNNER_TEMP/meta-harness"
      - name: Harness runner contract (the checks an OpenHands or Reef runner must pass)
        run: python scripts/e2e/check_runner.py --config configs/e2e/all_planes.json --work-dir "$RUNNER_TEMP/runner-check"
      - name: Trainer contract (the checks a Slime trainer must pass)
        run: python scripts/e2e/check_trainer.py --config configs/e2e/all_planes.json --work-dir "$RUNNER_TEMP/trainer-check"
      - name: Slime's declared support (trainer contract, then SFT, self-distillation, GRPO and harness moves in one campaign)
        run: |
          python scripts/e2e/check_trainer.py --config configs/e2e/slime.json --work-dir "$RUNNER_TEMP/slime-check"
          python scripts/e2e/honing_pipeline.py --config configs/e2e/slime.json --work-dir "$RUNNER_TEMP/slime"
      - name: Campaign end to end (runner, grader, gate, trainer, release chain)
        run: |
          python scripts/e2e/ra2_campaign.py --config configs/e2e/ra2_dry_run.json --work-dir "$RUNNER_TEMP/campaign"
          python scripts/e2e/check_campaign.py "$RUNNER_TEMP/campaign" --expect harness="rolled back" --expect train=published
      - name: Tank campaign end to end (real rounds against the planner, GEPA, teacher sft, grpo rollouts)
        run: |
          python scripts/e2e/tank_campaign.py --config configs/e2e/tank_dry_run.json --work-dir "$RUNNER_TEMP/tank-campaign"
          python scripts/e2e/check_campaign.py "$RUNNER_TEMP/tank-campaign" \
            --expect harness=published --expect train="rolled back" --expect train="rolled back"
      - name: Tank levers end to end (GEPA and Meta-Harness, teacher sft and a direction edit, in one campaign)
        run: |
          python scripts/e2e/tank_campaign.py --config configs/e2e/tank_levers_dry_run.json --work-dir "$RUNNER_TEMP/tank-levers"
          python scripts/e2e/check_campaign.py "$RUNNER_TEMP/tank-levers" \
            --expect harness=published --expect train="rolled back" --expect train="rolled back" \
            --expect harness="rolled back" --expect train="rolled back"
      - name: Tank harness runner contract
        run: python scripts/e2e/check_runner.py --config configs/e2e/tank_runner_check.json --work-dir "$RUNNER_TEMP/tank-runner-check"
      - name: Serving end to end (decision server process, the match's Node client stack)
        run: scripts/e2e/serving.sh "$RUNNER_TEMP/serving"
      - name: Tank War end to end (decision server, HTTP bridge, both decision interfaces)
        run: node scripts/e2e/tank-war.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-output
          path: |
            ${{ runner.temp }}/all-planes/summary.json
            ${{ runner.temp }}/meta-harness/summary.json
            ${{ runner.temp }}/campaign/summary.json
            ${{ runner.temp }}/campaign/releases/commits.jsonl
            ${{ runner.temp }}/tank-campaign/summary.json
            ${{ runner.temp }}/tank-campaign/releases/commits.jsonl
            ${{ runner.temp }}/tank-levers/summary.json
            ${{ runner.temp }}/tank-levers/releases/commits.jsonl
            ${{ runner.temp }}/serving/server.err
          if-no-files-found: ignore

  openhands:
    # The OpenHands runner with the real worker, in OpenHands' own environment installed from its lock
    # (integrations/openhands/README.md). No model or key: every episode is a real OpenHands conversation with the
    # stand-in policy server, so this catches a lock that no longer installs or a worker that no longer runs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Honing and the OpenHands environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . uv
          uv venv --python 3.12 integrations/openhands/.venv
          uv pip install --python integrations/openhands/.venv/bin/python -r integrations/openhands/requirements.txt
      - name: Harness runner contract with OpenHands as the agent
        run: python scripts/e2e/check_runner.py --config configs/e2e/openhands.json --work-dir "$RUNNER_TEMP/openhands-check"
      - name: All planes with OpenHands as the agent
        run: python scripts/e2e/honing_pipeline.py --config configs/e2e/openhands.json --work-dir "$RUNNER_TEMP/openhands"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openhands-output
          path: |
            ${{ runner.temp }}/openhands-check/workspaces/*/agent.log
            ${{ runner.temp }}/openhands/summary.json
          if-no-files-found: ignore

  pi:
    # The pi runner with the real worker, on pi installed from its lock (integrations/pi/README.md). No model or key:
    # every episode is a real pi session with the stand-in policy server, so this catches a lock that no longer
    # installs or a worker that no longer runs against pi's SDK.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/pi/package-lock.json
      - name: Install Honing and pi
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci --ignore-scripts --prefix integrations/pi
      - name: The pi runner's tests, those with the real worker included
        run: python -m pytest tests/test_pi_harness.py tests/test_pi_runner.py
      - name: Harness runner contract with pi as the agent
        run: python scripts/e2e/check_runner.py --config configs/e2e/pi.json --work-dir "$RUNNER_TEMP/pi-check"
      - name: All planes with pi as the agent
        run: python scripts/e2e/honing_pipeline.py --config configs/e2e/pi.json --work-dir "$RUNNER_TEMP/pi"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pi-output
          path: |
            ${{ runner.temp }}/pi-check/workspaces/*/agent.log
            ${{ runner.temp }}/pi/summary.json
          if-no-files-found: ignore

  agent-gateway:
    # The agent gateway's LiteLLM proxy, from its own environment installed from its lock
    # (integrations/agent_gateway/README.md), in front of a loopback upstream that serves chat completions only,
    # as SGLang does. No model or key: this catches a lock that no longer installs, a LiteLLM that no longer
    # carries Anthropic messages and OpenAI responses over to chat completions, or a route outside the agents' own.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Honing and the gateway environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" uv
          uv venv --python 3.12 integrations/agent_gateway/.venv
          uv pip install --python integrations/agent_gateway/.venv/bin/python -r integrations/agent_gateway/requirements.txt
      - name: Test
        run: python -m pytest tests/test_agent_gateway.py
        env:
          # A test that needs the proxy fails rather than skips when its environment is missing.
          HONING_REQUIRE_GATEWAY: "1"
