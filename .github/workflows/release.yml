name: release

# A maintainer pushes a tag vMAJOR.MINOR.PATCH on a commit of main whose CI and GPU check passed
# (CONTRIBUTING.md, Releases). This builds the sdist and wheel, version from the tag (setuptools-scm),
# and publishes a GitHub release with them and notes generated from the merged pull requests.
# Modelled on Reef's release workflow, without its PyPI job: llm-honing is not on PyPI.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # setuptools-scm derives the version from tags; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: The version is the tag's
        run: |
          ls dist
          test -f "dist/llm_honing-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Create the GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
