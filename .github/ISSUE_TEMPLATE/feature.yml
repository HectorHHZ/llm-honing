name: Feature proposal
description: A new capability, algorithm, or integration
title: "[Feature] "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The user problem this solves. Describe the situation, not the solution.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: What it would do, and which plane owns it (prune / train / data / harness / serve / core).
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: rfc
    attributes:
      label: Scope check
      options:
        - label: This changes a plane's public protocol, a persisted format, or a design principle, so it needs an RFC first.
